.l{animation:in .35s ease-out both}
.cover,.cur1{animation:type .8s steps(8) .5s both}
.cur1{animation:type .8s steps(8) .5s both, gone 0s linear 1.5s both}
.cur2{animation:blink 1s steps(1) infinite}
