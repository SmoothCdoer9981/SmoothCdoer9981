@keyframes type{from{transform:translateX(0)}to{transform:translateX(67.2px)}}
@keyframes gone{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.cur2{animation:none}.cover,.cur1{display:none}}
</style>
